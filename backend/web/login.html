<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 西瓜家庭工作台</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f3;color:#20372d;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(430px,92vw);background:white;border:1px solid #e0e7dd;border-radius:24px;padding:40px;box-shadow:0 16px 60px #21382c0c}.brand{font-size:13px;letter-spacing:3px;color:#6d846e}h1{font-size:29px;margin:20px 0 12px}p{color:#708075;line-height:1.8;font-size:14px}label{display:block;margin-top:28px;font-size:13px}input,button{font:inherit;width:100%;padding:14px;border:1px solid #dbe3d8;border-radius:10px;margin-top:10px}button{background:#34684d;color:white;border:0;cursor:pointer}#error{color:#ae4038;min-height:22px;font-size:13px}</style><div class="box"><div class="brand">XIGUA / PERSONAL</div><h1>你的家庭工作台</h1><p>照顾宝宝的每一天，保管重要的每一份文件。<br>一次登录，自由切换育儿与备份。</p><form id="login"><label for="key">统一管理 Key</label><input id="key" type="text" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="粘贴完整的 Cloud Backup 管理 Key" required><button>进入工作台 →</button><p id="error" role="alert"></p></form></div><script>const BASE=__CONSOLE_BASE_JSON__;document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const r=await fetch(BASE+'/console/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:document.querySelector('#key').value.trim()})});if(!r.ok)throw Error('管理 Key 不正确，请使用原 Cloud Backup 管理 Key');location=BASE+'/console'}catch(x){document.querySelector('#error').textContent=x.message}finally{button.disabled=false}};</script></html>
