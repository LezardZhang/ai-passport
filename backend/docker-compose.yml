services:
  childcare-api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
    env_file:
      - .env
    volumes:
      - childcare-data:/data

volumes:
  childcare-data:
